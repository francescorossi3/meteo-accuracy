name: Aggiornamento giornaliero

on:
  schedule:
    - cron: "17 6 * * *"        # ogni giorno alle 06:17 UTC (07:17 / 08:17 ora italiana)
    - cron: "37 10 * * *"       # riserva: parte solo se quello del mattino non ha aggiornato i dati
  workflow_dispatch:             # avvio manuale dal tab "Actions"

permissions:
  contents: write                # per salvare i dati nel repository
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  # avvio di riserva (10:37 UTC): se oggi i dati sono gia' stati aggiornati non fa nulla
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - id: c
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "37 10 * * *" ] \
             && git log --since="$(date -u +%F) 00:00" --format=%s | grep -q "^Dati $(date -u +%F)"; then
            skip=true; echo "Dati gia' aggiornati oggi: niente da fare"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      TOMORROW_API_KEY: ${{ secrets.TOMORROW_API_KEY }}
      VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
      METEO_USER_AGENT: "meteo-accuracy github.com/${{ github.repository }}"
      OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
    needs: check
    if: needs.check.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Stazioni (solo al primo avvio)
        run: test -f data/stations.csv || python scripts/00_setup_stations.py

      - name: Previsioni (modelli ultimi 3 giorni + snapshot di oggi)
        run: python -u scripts/01_fetch_forecasts.py

      - name: Osservazioni (ultimi 10 giorni)
        run: python -u scripts/02_fetch_observations.py

      - name: Verifica e classifiche
        run: python -u scripts/03_verify.py

      - name: Modelli GPR
        run: python -u scripts/04_train_gpr.py

      - name: Backtest storico GPR (solo se l'ultimo ha piu' di 7 giorni)
        run: python -u scripts/07_backtest_gpr.py

      - name: Mappe
        run: python -u scripts/05_build_maps.py

      - name: Sito
        run: python -u scripts/06_build_site.py

      - name: Salva i dati nel repository
        run: |
          git config user.name  "meteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Dati $(date -u +%F)" || echo "niente da salvare"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
